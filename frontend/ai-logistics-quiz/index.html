<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI For Logistics Quiz - ข้อมูลส่วนตัว</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="logistics-bg"></div>
    <div class="truck-icon">🚚</div>

    <div class="container">
        <div class="hero fade-in">
            <h1>แบบทดสอบหลักสูตร</h1>
            <p>“การประยุกต์ใช้เทคโนโลยีปัญญาประดิษฐ์สำหรับงานโลจิสติกส์ (AI for Logistics)”</p>
        </div>

        <div class="card fade-in" style="animation-delay: 0.1s;">
            <h2 style="margin-bottom: 24px;">กรอกข้อมูลส่วนตัว</h2>
            <form id="infoForm">
                <div class="form-group">
                    <label for="fullName">ชื่อ-สกุล</label>
                    <input type="text" id="fullName" name="fullName" placeholder="ป้อนชื่อและนามสกุลของคุณ" required>
                </div>

                <div class="form-group">
                    <label for="email">อีเมล</label>
                    <input type="email" id="email" name="email" placeholder="example@email.com" required>
                </div>

                <div class="form-group">
                    <label for="phone">เบอร์โทร</label>
                    <input type="tel" id="phone" name="phone" placeholder="08xxxxxxxx" required>
                </div>

                <div class="form-group">
                    <label for="ageRange">ช่วงอายุ</label>
                    <select id="ageRange" name="ageRange" required>
                        <option value="" disabled selected>เลือกช่วงอายุ</option>
                        <option value="below-20">ต่ำกว่า 20 ปี</option>
                        <option value="20-30">20 - 30 ปี</option>
                        <option value="31-40">31 - 40 ปี</option>
                        <option value="41-50">41 - 50 ปี</option>
                        <option value="above-50">50 ปีขึ้นไป</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="education">ระดับการศึกษา</label>
                    <select id="education" name="education" required>
                        <option value="" disabled selected>เลือกระดับการศึกษา</option>
                        <option value="high-school">มัธยมศึกษา / ปวช.</option>
                        <option value="diploma">ปวส.</option>
                        <option value="bachelor">ปริญญาตรี</option>
                        <option value="master">ปริญญาโท</option>
                        <option value="doctorate">ปริญญาเอก</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="expectations">สิ่งที่คาดหวังจากการอบรมในวันนี้</label>
                    <textarea id="expectations" name="expectations" rows="3" placeholder="ระบุสิ่งที่ท่านคาดหวัง..." required></textarea>
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%;">เริ่มทำแบบทดสอบ</button>
            </form>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script>
        document.getElementById('infoForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const formData = new FormData(this);
            const data = Object.fromEntries(formData.entries());
            
            // Save to localStorage to carry over to quiz.html
            localStorage.setItem('user_info', JSON.stringify(data));
            
            // Redirect to quiz
            window.location.href = 'quiz.html';
        });
    </script>
</body>
</html>
