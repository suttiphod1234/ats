<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI For Logistics Quiz - แบบทดสอบ</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .quiz-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .question-text {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 20px;
            color: var(--primary);
        }
        .quiz-footer {
            margin-top: 30px;
            display: flex;
            justify-content: space-between;
        }
    </style>
</head>
<body>
    <div class="logistics-bg"></div>
    
    <div class="container">
        <div class="hero fade-in">
            <h1>แบบทดสอบหลักสูตร</h1>
            <p>“การประยุกต์ใช้เทคโนโลยีปัญญาประดิษฐ์สำหรับงานโลจิสติกส์”</p>
        </div>

        <div class="progress-container fade-in">
            <div id="progress-bar" class="progress-bar" style="width: 0%;"></div>
        </div>

        <div id="quiz-container" class="card fade-in">
            <div class="quiz-header">
                <span id="question-number" style="font-weight: 600; color: var(--secondary);">คำถามที่ 1/10</span>
                <span id="score-display" style="color: var(--text-muted);">คะแนน: 0</span>
            </div>

            <div id="question-container">
                <!-- Question content will be injected by JS -->
            </div>

            <div class="quiz-footer">
                <button id="prev-btn" class="btn btn-secondary" style="visibility: hidden;">ก่อนหน้า</button>
                <button id="next-btn" class="btn btn-primary">ถัดไป</button>
            </div>
        </div>
    </div>

    <!-- Score Modal -->
    <div id="score-modal" class="modal-overlay">
        <div class="modal-content">
            <h2 id="modal-title">ยินดีด้วย! คุณทำข้อสอบสำเร็จ</h2>
            <div style="font-size: 3rem; font-weight: 700; color: var(--secondary); margin: 24px 0;">
                <span id="final-score">0</span> / 10
            </div>
            <p id="modal-message" style="margin-bottom: 30px;">คุณได้คะแนนยอดเยี่ยมมาก!</p>
            <div style="display: flex; gap: 12px; justify-content: center;">
                <button id="retry-btn" class="btn btn-secondary">ทำใหม่ (สลับข้อ)</button>
                <button id="submit-btn" class="btn btn-primary">ส่งคะแนน</button>
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script>
        // Quiz Initialization
        document.addEventListener('DOMContentLoaded', () => {
            // Check if user info exists
            const userInfo = JSON.parse(localStorage.getItem('user_info'));
            if (!userInfo) {
                window.location.href = 'index.html';
                return;
            }
            initQuiz();
        });
    </script>
</body>
</html>
